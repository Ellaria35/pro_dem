<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | EllantageVolley</title>
  <link rel="shortcut icon" href="logo.png">
  <link rel="stylesheet" href="login.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

  <div class="auth-wrapper">
    <!-- Header/Logo -->
    <header class="app-header">
      <div class="logo">
        <img src="logo.png" alt="EllantageVolley Logo" class="auth-logo-img">
        <span class="logo-name">EllantageVolley</span>
      </div>
      <p class="tagline">Volleyball fitness and jump tracker</p>
    </header>

    <!-- Log In Form Card -->
    <main class="auth-card">
      <h1>LOG IN</h1>

      <!-- Redirects to Dashboard (index.html) upon submission -->
      <form class="auth-form" action="dashboard.html">
        <div class="input-group">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="name@example.com" required>
        </div>

        <div class="input-group">
          <div class="label-row">
            <label for="loginPassword">Password</label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>
          <input type="password" id="loginPassword" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn-primary">Log In</button>
      </form>
      <p class="footer-text">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </p>
    </main>
  </div>

</body>
</html>
